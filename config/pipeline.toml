[analysis]
account_id = 'U1717377'

[strategy]
ticker = "SPY"
date_cut = "20160101"
need_time = 9.6
cut_delta_up = 0.40
cut_delta_down = 0.10
need_delta = 0.35

latency_max_seconds = 120.0

option_concurrency = 8
tick_concurrency = 8
stop_window_ms = 300000
fallback_exit_option_price = 0.02

# Supported values: quotes, trades.
stock_tick_source = "trades"
trade_exit_option_window_ms = 60000

[eod]
symbols = ["SPY"]

# Empty from_date means: start after the max date already present in local yearly EOD files.
from_date = "20160101"

# Empty end_date means: previous business day.
end_date = ""

# Supported values: daily, weekly, monthly, yearly, all.
# Each requested range is merged into the corresponding yearly parquet immediately.
# Keep daily for full-chain SPY EOD; larger ranges can be very memory-heavy.
batch_mode = "weekly"

# Optional filters. Uncomment only when you intentionally want a smaller chain.
# max_dte = 90
# strike_range = 50

[m1]
symbols = ["SPY"]

# Empty values mean:
# - update/download: start after the max date already present in local M1 raw files
# - enrich: use every date present in selected local option M1 parquet files
from_date = "20160101"
end_date = ""

# Supported values: daily, weekly, monthly, yearly, all.
# For stock M1 this controls true start_date/end_date request batching.
# For option M1 with option_expiration_mode="same_day", requests stay daily for accuracy.
batch_mode = "weekly"

# Allowed values: 1, 2, 4, 8. Pick the number available for your Theta subscription level.
stock_concurrency = 8
option_concurrency = 8

# Current SPY M1 raw files are 0DTE: option expiration equals quote date.
# Supported values: same_day, all.
option_expiration_mode = "same_day"

[tick]
symbols = ["SPY"]

# Supported values: stock_quote, stock_trade, option_quote.
mode = "option_quote"

# Tick/second data is intentionally window-based. Strategy code should decide the window.
date = "20260515"
start_ms = 54000000
end_ms = 54060000

# Supported Theta intervals for quote endpoints: tick, 10ms, 100ms, 500ms, 1s, ...
interval = "100ms"

# Required only for mode = "option_quote".
expiration = "20260515"
strike = 360000
right = "C"
